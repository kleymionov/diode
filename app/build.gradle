apply plugin: 'com.android.application'

android {
    namespace 'in.shick.diode'
    compileSdkVersion 35
    useLibrary 'org.apache.http.legacy'

    defaultConfig {
        applicationId "in.shick.diode.personal"
        versionCode 27
        versionName "1.3.2.3-personal"
        minSdkVersion 26
        targetSdkVersion 29
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles 'proguard.cfg'
        }
    }
    buildFeatures {
        buildConfig true
    }
    packagingOptions{
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/DEPENDENCIES'
    }

    lintOptions {
        // Too much ancient debt to fight today.
        abortOnError false
    }
}

dependencies {
    implementation files('libs/automaton.jar')
    implementation files('libs/jackson-core-asl-1.8.5.jar')
    implementation files('libs/jackson-mapper-asl-1.8.5.jar')
    testImplementation 'junit:junit:4.13.2'
}
